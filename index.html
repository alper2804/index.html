<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Yerçekimi Simülasyonu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 20, 30, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto; /* Arama kutusuna tıklanabilsin diye */
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #00d2ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 20px;
        }
        #search-input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }
        #search-input:focus { border-color: #00ea8d; }
        #search-btn {
            background: #00ea8d;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #search-btn:hover { background: #00c777; }
        
        .data-row { margin-bottom: 12px; display: flex; flex-direction: column; }
        .data-label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        .data-value { font-size: 1.1rem; font-weight: bold; color: #fff; }
        .highlight { color: #00ea8d; font-size: 1.4rem; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 999;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Dünya Yükleniyor...</div>
    <div id="canvas-container"></div>
    
    <div id="ui-panel">
        <h2>Yerçekimi Analizi</h2>
        
        <!-- YENİ: Arama Kutusu -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="İl, İlçe veya Ülke..." />
            <button id="search-btn">Bul</button>
        </div>
        
        <div class="data-row">
            <span class="data-label">Koordinatlar</span>
            <span class="data-value" id="coords-val">Seçim Bekleniyor...</span>
        </div>
        <div class="data-row">
            <span class="data-label">Konum</span>
            <span class="data-value" id="location-val">-</span>
        </div>
        <div class="data-row">
            <span class="data-label">Yerçekimi İvmesi (g)</span>
            <span class="data-value highlight" id="gravity-val">0.00000 m/s²</span>
        </div>
    </div>

    <div class="instruction">Dünya üzerinde bir noktaya tıklayın veya arama kutusunu kullanın.</div>

    <!-- Kütüphaneler -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
