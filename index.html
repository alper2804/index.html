<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Yerçekimi Analiz Ağı (G.G.A.N)</title>
    <style>
        :root {
            --bg-color: #030508;
            --panel-bg: rgba(10, 15, 20, 0.85);
            --primary: #ff9900; 
            --secondary: #00f0ff;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --border: rgba(255, 153, 0, 0.2);
        }
        body {
            margin: 0; overflow: hidden; background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text-main);
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        
        .dashboard {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; display: grid;
            grid-template-columns: 340px 1fr 340px; grid-template-rows: 1fr 200px;
            padding: 20px; box-sizing: border-box; gap: 20px;
        }

        .panel {
            background: var(--panel-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 20px; pointer-events: auto; overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            border-top: 3px solid var(--primary);
        }

        .left-panel { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 20px; }
        .bottom-panel { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; justify-content: center; }
        .right-panel { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 20px; }

        h2 { margin: 0; font-size: 1.1rem; color: var(--secondary); text-transform: uppercase; letter-spacing: 2px; }
        h3 { margin: 0 0 10px 0; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .search-box { display: flex; gap: 10px; }
        .search-box input {
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            color: var(--primary); padding: 10px; border-radius: 4px; outline: none; font-family: monospace; font-size: 1rem;
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 153, 0, 0.2); }
        .search-box button {
            background: var(--primary); color: #000; border: none; padding: 0 15px; border-radius: 4px;
            cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.2s;
        }
        .search-box button:hover { background: #ffaa33; box-shadow: 0 0 15px var(--primary); }

        .data-block { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 4px; }
        .data-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .data-value { font-size: 1.2rem; font-weight: bold; color: #fff; font-family: monospace; }
