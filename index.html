<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Yerçekimi Simülasyonu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 20, 30, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #00d2ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .data-row {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .data-label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .data-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        .highlight {
            color: #00ea8d;
            font-size: 1.4rem;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 999;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Dünya Yükleniyor...</div>
    <div id="canvas-container"></div>
    
    <div id="ui-panel">
        <h2>Yerçekimi Analizi</h2>
        
        <div class="data-row">
            <span class="data-label">Koordinatlar</span>
            <span class="data-value" id="coords-val">Seçim Bekleniyor...</span>
        </div>
        
        <div class="data-row">
            <span class="data-label">Konum (İlçe / İl)</span>
            <span class="data-value" id="location-val">-</span>
        </div>
        
        <div class="data-row">
            <span class="data-label">Yerçekimi İvmesi (g)</span>
            <span class="data-value highlight" id="gravity-val">0.00000 m/s²</span>
        </div>
    </div>

    <div class="instruction">Dünya üzerinde bir noktaya tıklayın. Etrafında dönmek için sürükleyin, yakınlaşmak için kaydırın.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Yükleme ekranı takılı kalmasın diye 3 saniyelik zorunlu kapatma (Failsafe)
        setTimeout(() => {
            const loader = document.getElementById('loading');
            if(loader) loader.style.display = 'none';
        }, 3000);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4.5; 
        controls.maxDistance = 30;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.02,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        const earthRadius = 4;
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128); 
        
        const textureLoader = new THREE.TextureLoader();
        
        // Yeni güvenilir CDN linkleri
        const earthTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_atmos_2048.jpg', () => {
            document.getElementById('loading').style.display = 'none';
        });
        const specularMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_specular_2048.jpg');

        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            specularMap: specularMap,
            specular: new THREE.Color('grey'),
            shininess: 30
        });

        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        const markerGroup = new THREE.Group();
        scene.add(markerGroup);
        markerGroup.visible = false;

        const pinBodyGeo = new THREE.CylinderGeometry(0.01, 0.005, 0.3, 16);
        const pinBodyMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const pinBody = new THREE.Mesh(pinBodyGeo, pinBodyMat);
        pinBody.position.y = 0.15; 
        pinBody.rotation.x = Math.PI / 2;
        markerGroup.add(pinBody);

        const pinHeadGeo = new THREE.SphereGeometry(0.04, 32, 32);
        const pinHeadMat = new THREE.MeshBasicMaterial({ color: 0x00ea8d });
        const pinHead = new THREE.Mesh(pinHeadGeo, pinHeadMat);
        pinHead.position.z = 0.3; 
        markerGroup.add(pinHead);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(earth);

            if (intersects.length > 0) {
                const point = intersects[0].point;
                
                markerGroup.position.copy(point);
                markerGroup.lookAt(new THREE.Vector3(0,0,0)); 
                markerGroup.rotation.x -= Math.PI / 2;
                markerGroup.visible = true;

                const lat = 90 - (Math.acos(point.y / earthRadius) * 180 / Math.PI);
                let lon = (Math.atan2(point.x, point.z) * 180 / Math.PI);
                lon = lon - 90;
                if(lon < -180) lon += 360;

                document.getElementById('coords-val').innerText = `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;

                const g_e = 9.7803253359;
                const k = 0.00193185265241;
                const e2 = 0.00669437999014;
                const latRad = lat * Math.PI / 180;
                const sin2 = Math.pow(Math.sin(latRad), 2);
                const gravity = g_e * ((1 + k * sin2) / Math.sqrt(1 - e2 * sin2));
                
                document.getElementById('gravity-val').innerText = `${gravity.toFixed(5)} m/s²`;
                document.getElementById('location-val').innerText = "Konum aranıyor...";

                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.address) {
                            let ilce = data.address.town || data.address.county || data.address.village || "";
                            let il = data.address.city || data.address.state || data.address.province || data.address.country || "Bilinmiyor";
                            let konumMetni = ilce ? `${ilce}, ${il}` : il;
                            document.getElementById('location-val').innerText = konumMetni;
                        } else {
                            document.getElementById('location-val').innerText = "Okyanus / Tanımsız Bölge";
                        }
                    })
                    .catch(err => {
                        document.getElementById('location-val').innerText = "Bağlantı Hatası";
                    });
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            particlesMesh.rotation.y += 0.0005;
            particlesMesh.rotation.x += 0.0002;

            if (markerGroup.visible) {
                const distance = camera.position.distanceTo(earth.position);
                const scale = Math.max(0.3, distance / 12); 
                markerGroup.scale.set(scale, scale, scale);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
