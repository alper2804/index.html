<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Yerçekimi Simülasyonu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #00d2ff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        #search-input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }
        #search-input:focus { border-color: #00ea8d; }
        #search-btn {
            background: #00ea8d;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #search-btn:hover { background: #00c777; }

        .data-row {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .data-label {
            font-size: 0.8rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .data-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
        }
        .highlight {
            color: #00ea8d;
            font-size: 1.4rem;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #fff;
            background: rgba(0,0,0,0.8);
            padding: 15px 30px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 999;
        }
        .instruction {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="loading">Dünya Yükleniyor...</div>
    <div id="canvas-container"></div>
    
    <div id="ui-panel">
        <h2>Yerçekimi Analizi</h2>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Örn: Bucak, Burdur..." />
            <button id="search-btn">Bul</button>
        </div>
        
        <div class="data-row">
            <span class="data-label">Koordinatlar</span>
            <span class="data-value" id="coords-val">Seçim Bekleniyor...</span>
        </div>
        
        <div class="data-row">
            <span class="data-label">Konum (İlçe / İl)</span>
            <span class="data-value" id="location-val">-</span>
        </div>
        
        <div class="data-row">
            <span class="data-label">Yerçekimi İvmesi (g)</span>
            <span class="data-value highlight" id="gravity-val">0.00000 m/s²</span>
        </div>
    </div>

    <div class="instruction">Dünya üzerinde bir noktaya tıklayın veya arama kutusunu kullanın.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        setTimeout(() => {
            const loader = document.getElementById('loading');
            if(loader) loader.style.display = 'none';
        }, 3000);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 4.5; 
        controls.maxDistance = 30;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        // Uzay Tozları
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 50;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMesh = new THREE.Points(particlesGeometry, new THREE.PointsMaterial({ size: 0.02, color: 0xffffff, transparent: true, opacity: 0.6 }));
        scene.add(particlesMesh);

        const earthRadius = 4;
        const earthGeometry = new THREE.SphereGeometry(earthRadius, 128, 128); 
        
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_atmos_2048.jpg', () => {
            document.getElementById('loading').style.display = 'none';
        });
        const specularMap = textureLoader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/textures/planets/earth_specular_2048.jpg');

        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            specularMap: specularMap,
            specular: new THREE.Color('grey'),
            shininess: 25
        });

        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
